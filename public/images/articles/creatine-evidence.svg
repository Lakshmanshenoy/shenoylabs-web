<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e2a3a" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <g stroke="#1e2a3a" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
  </g>

  <!-- Decorative vertical beams -->
  <rect x="180" y="0" width="60" height="630" fill="url(#beam)"/>
  <rect x="960" y="0" width="60" height="630" fill="url(#beam)"/>

  <!-- Molecular structure: Creatine (simplified CN bond motif) -->
  <g transform="translate(600, 315)" filter="url(#glow)">
    <!-- Central ring-like structure -->
    <ellipse cx="0" cy="0" rx="140" ry="120" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="100" ry="85" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Nodes -->
    <g fill="#60a5fa">
      <circle cx="-80" cy="-60" r="10" opacity="0.9"/>
      <circle cx="80" cy="-60" r="8" opacity="0.8"/>
      <circle cx="-80" cy="60" r="8" opacity="0.8"/>
      <circle cx="80" cy="60" r="10" opacity="0.9"/>
      <circle cx="0" cy="-90" r="12" opacity="0.95"/>
      <circle cx="0" cy="90" r="12" opacity="0.95"/>
      <circle cx="-50" cy="0" r="14" opacity="1"/>
      <circle cx="50" cy="0" r="14" opacity="1"/>
      <circle cx="0" cy="0" r="18" fill="#3b82f6" opacity="1"/>
    </g>

    <!-- Bonds -->
    <g stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="0" x2="-50" y2="0"/>
      <line x1="0" y1="0" x2="50" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="-90"/>
      <line x1="0" y1="0" x2="0" y2="90"/>
      <line x1="-50" y1="0" x2="-80" y2="-60"/>
      <line x1="-50" y1="0" x2="-80" y2="60"/>
      <line x1="50" y1="0" x2="80" y2="-60"/>
      <line x1="50" y1="0" x2="80" y2="60"/>
    </g>

    <!-- Outer orbital dots -->
    <g fill="#93c5fd" opacity="0.5">
      <circle cx="-120" cy="-90" r="3"/>
      <circle cx="120" cy="-90" r="3"/>
      <circle cx="-120" cy="90" r="3"/>
      <circle cx="120" cy="90" r="3"/>
      <circle cx="0" cy="-130" r="3"/>
      <circle cx="0" cy="130" r="3"/>
    </g>
  </g>

  <!-- Article metadata: Category label -->
  <text x="100" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" letter-spacing="3" text-transform="uppercase">
    SUPPLEMENT SCIENCE
  </text>

  <!-- Article title area -->
  <text x="100" y="200" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#f0f4f8" line-height="1.1">
    <tspan x="100" dy="0">Creatine</tspan>
    <tspan x="100" dy="68">Which Claims Actually</tspan>
    <tspan x="100" dy="68">Survive the Evidence?</tspan>
  </text>

  <!-- Skepsis badge -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="260" height="48" rx="8" fill="#1a2332" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="31" font-family="monospace, ui-monospace, Menlo, monospace" font-size="14" font-weight="500" fill="#93c5fd" letter-spacing="1">
      σκέψις  INVESTIGATION 001
    </text>
  </g>

  <!-- Bottom-right decorative score strip -->
  <g transform="translate(900, 520)">
    <rect x="0" y="0" width="200" height="56" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">CLAIMS EVALUATED</text>
    <text x="16" y="46" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#60a5fa">9</text>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">REFERENCES</text>
    <text x="110" y="46" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#60a5fa">14</text>
  </g>
</svg>
