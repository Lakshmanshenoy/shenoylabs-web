<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a150e"/>
      <stop offset="50%" stop-color="#2d2315"/>
      <stop offset="100%" stop-color="#1a150e"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f5c93d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e8a838" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Golden glow behind title -->
  <ellipse cx="600" cy="250" rx="500" ry="180" fill="url(#sun)" filter="url(#blur)"/>

  <!-- Decorative molecular DNA-like helix on left -->
  <g opacity="0.12" stroke="#e8a838" stroke-width="2" fill="none">
    <path d="M140,320 Q200,220 140,120" />
    <path d="M140,320 Q80,220 140,120" />
    <path d="M120,290 Q160,250 120,210" />
    <path d="M120,290 Q80,250 120,210" />
    <circle cx="140" cy="120" r="6" fill="#e8a838"/>
    <circle cx="140" cy="220" r="5" fill="#e8a838"/>
    <circle cx="140" cy="320" r="5" fill="#e8a838"/>
    <circle cx="140" cy="420" r="5" fill="#e8a838"/>
    <circle cx="140" cy="520" r="6" fill="#e8a838"/>
  </g>

  <!-- Decorative molecular DNA-like helix on right -->
  <g opacity="0.12" stroke="#e8a838" stroke-width="2" fill="none">
    <path d="M1060,320 Q1000,420 1060,520" />
    <path d="M1060,320 Q1120,420 1060,520" />
    <circle cx="1060" cy="120" r="6" fill="#e8a838"/>
    <circle cx="1060" cy="220" r="5" fill="#e8a838"/>
    <circle cx="1060" cy="320" r="5" fill="#e8a838"/>
    <circle cx="1060" cy="420" r="5" fill="#e8a838"/>
    <circle cx="1060" cy="520" r="6" fill="#e8a838"/>
  </g>

  <!-- Small decorative ghee pot icons (abstract circles) -->
  <circle cx="220" cy="180" r="8" fill="#e8a838" opacity="0.15"/>
  <circle cx="980" cy="200" r="8" fill="#e8a838" opacity="0.15"/>
  <circle cx="200" cy="450" r="6" fill="#e8a838" opacity="0.12"/>
  <circle cx="1000" cy="430" r="6" fill="#e8a838" opacity="0.12"/>

  <!-- Tags -->
  <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#b8944a" opacity="0.9">
    EVIDENCE-BASED INVESTIGATION
  </text>

  <!-- Decorative line -->
  <line x1="200" y1="220" x2="1000" y2="220" stroke="#e8a838" stroke-width="1" opacity="0.25"/>

  <!-- Main title -->
  <text x="600" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" text-anchor="middle" fill="#f5e6c8" line-height="1.2">
    A2 Ghee
  </text>
  <text x="600" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" text-anchor="middle" fill="#d4b87a">
    Does the Science That Sells It
  </text>
  <text x="600" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" text-anchor="middle" fill="#d4b87a">
    Actually Apply?
  </text>

  <!-- Subtitle -->
  <text x="600" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="300" text-anchor="middle" fill="#a89b7d" font-style="italic">
    A forensically researched audit of marketing claims vs. peer-reviewed evidence
  </text>

  <!-- Author / date -->
  <text x="600" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#7a7058" letter-spacing="1">
    LAKSHMAN SHENOY  ·  JUNE 2026  ·  7,000+ WORDS
  </text>

  <!-- Bottom decorative gradient fade -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#glow)" opacity="0.5"/>

  <!-- Top subtle border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#e8a838" stroke-width="4" opacity="0.5"/>
</svg>
